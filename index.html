<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#15132A"><title>MindGrid — Train Your Focus</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F0FA;--fg:#1B1833;--mut:#6B6789;--card:#FFFFFF;--tile:#5B54D6;--acc:#E8890C;--ok:#1E9E62;--bad:#D6344F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132A;--fg:#F1EFFF;--mut:#9C98C4;--card:#211E3D;--tile:#9A94FF;--acc:#FFC24B;--ok:#4CD394;--bad:#FF6B81}}
:root[data-theme="dark"]{--bg:#15132A;--fg:#F1EFFF;--mut:#9C98C4;--card:#211E3D;--tile:#9A94FF;--acc:#FFC24B;--ok:#4CD394;--bad:#FF6B81}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;user-select:none}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
h1{font-size:40px;margin:8px 0 0;letter-spacing:-1px}
.sub{color:var(--mut);margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--tile);color:var(--bg);font-weight:700;font-size:20px;padding:18px;border-radius:18px;width:100%}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--tile)}
.btn:disabled{opacity:.45}
.stats{display:flex;gap:10px}.stat{flex:1;background:var(--card);border-radius:16px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--mut)}
.bar{height:12px;background:var(--card);border-radius:8px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.top big{font-size:44px}
.grid{display:grid;gap:8px;width:100%;aspect-ratio:1}
.t{background:none;display:flex;align-items:center;justify-content:center}
.t i{display:block;border-radius:50%;background:var(--tile);width:74%;height:74%;transition:transform .12s}
.t:active i{transform:scale(.9)}
.t.ok i{background:var(--ok)!important}.t.no i{background:var(--bad)!important}.t.show i{outline:4px solid var(--acc);outline-offset:3px}
.tm{height:8px;background:var(--card);border-radius:6px;overflow:hidden}.tm i{display:block;height:100%;background:var(--acc);width:100%}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:16px;border-radius:14px}
.tog{background:var(--mut);width:52px;height:30px;border-radius:16px;position:relative}.tog.on{background:var(--ok)}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tog.on:after{left:25px}
.flash{text-align:center;font-weight:700;color:var(--acc);height:24px}
.res{text-align:center}.res .big{font-size:84px;font-weight:800;line-height:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;color:var(--mut);padding:10px;font-size:16px}
.rm *{transition:none!important;animation:none!important}
.pop{animation:p .25s}@keyframes p{50%{transform:scale(1.15)}}
</style></head><body><div id="app"></div>
<script>
// ---------- storage ----------
const KEY='mindgrid.v1';
const def={best:0,bestCombo:0,bestAcc:0,bestRt:0,played:0,rtSum:0,rtN:0,correct:0,total:0,secs:0,streak:0,lastDay:'',today:{day:'',score:0},daily:{day:'',score:null},level:1,
 set:{sound:true,haptics:true,dark:null,reduce:false},hist:[]};
let S;
function load(){try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));S.set=Object.assign({},def.set,S.set)}catch(e){S=JSON.parse(JSON.stringify(def))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
// ---------- feedback ----------
let ac;
function tone(f,d=.08,type='sine'){if(!S.set.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const vib=p=>{if(S.set.haptics&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const sfx={ok:()=>{tone(660);vib(12)},no:()=>{tone(180,.18,'triangle');vib([30,40,30])},combo:()=>{tone(880,.1);setTimeout(()=>tone(1175,.12),90);vib(25)},end:()=>{tone(440,.15);setTimeout(()=>tone(330,.25),150)},tick:()=>tone(520,.05)};
// ---------- engine: RNG, difficulty, scoring ----------
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function difficulty(level){ // level 0..25 (float)
 return{grid:clamp(3+Math.floor(level/5),3,6),delta:Math.max(.06,.32*Math.pow(.9,level)),limit:Math.max(1.2,3.6-.1*level)*1000,mult:1+Math.floor(level/5)*.25};}
const comboMult=c=>c>=10?4:c>=5?3:c>=3?2:1;
function scoreCorrect(rt,level,combo){const d=difficulty(level);const sp=rt<500?2:rt<900?1:0;return Math.round(1*d.mult*comboMult(combo))+sp}
function adapt(st,ok,rt,limit){ // rolling average smoothing
 st.acc=st.acc*.8+(ok?1:0)*.2;st.spd=st.spd*.8+clamp(1-rt/limit,0,1)*.2;
 if(st.acc>.8&&st.spd>.35)st.level=clamp(st.level+.35,0,25);
 else if(st.acc<.55)st.level=clamp(st.level-.3,0,25);
 else st.level=clamp(st.level+.08,0,25);}
function makeRound(level,rand){const d=difficulty(level),n=d.grid*d.grid;return{d,n,target:Math.floor(rand()*n),hue:Math.floor(rand()*360)}}
// ---------- ui ----------
const $=id=>document.getElementById(id),app=$('app');
function applyTheme(){const r=document.documentElement;if(S.set.dark===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.set.dark?'dark':'light');document.body.className=S.set.reduce?'rm':''}
let G=null,timers=[];
function clearT(){timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[];if(G)G.raf&&cancelAnimationFrame(G.raf)}
function home(){clearT();G=null;const t=S.today.day===dayKey()?S.today.score:0;const dd=S.daily.day===dayKey();
 app.innerHTML=`<div><h1>MindGrid</h1><p class="sub">Train Your Focus</p></div>
 <button class="btn" onclick="start(false)">Quick Play</button>
 <button class="btn alt" onclick="start(true)" ${dd?'disabled':''}>${dd?'Daily done: '+S.daily.score+' pts':'Daily Challenge'}</button>
 <div class="stats"><div class="stat"><b>${t}</b><span>Today</span></div><div class="stat"><b>${S.best}</b><span>Best</span></div><div class="stat"><b>${S.streak}</b><span>Day streak</span></div></div>
 <button class="btn alt" onclick="stats()">Your progress</button>
 <button class="btn alt" onclick="settings()">Settings</button>
 <p class="sub" style="text-align:center">Spot the odd dot. 60 seconds. It gets harder as you get better.</p>`}
function start(daily){if(daily&&S.daily.day===dayKey())return;clearT();
 const seed=daily?[...dayKey()].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7):Date.now();
 G={daily,rand:rng(seed),score:0,combo:0,bestCombo:0,ok:0,tot:0,rtS:0,st:{level:Math.min(S.level,6),acc:.7,spd:.4},left:60,lock:true,t0:0};
 let n=3;app.innerHTML=`<div class="res" style="margin-top:30vh"><div class="big" id="cd">3</div><p class="sub">Get ready</p></div>`;sfx.tick();
 const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);play()}else{$('cd').textContent=n;sfx.tick()}},700);timers.push(iv)}
function play(){G.endAt=Date.now()+60000;
 app.innerHTML=`<div class="top"><span>Score <b id="sc">0</b></span><big id="tl">60</big><span>Combo <b id="cb">0</b></span></div><div class="tm"><i id="rb"></i></div><div class="flash" id="fl"></div><div class="grid" id="gr"></div><button class="link" onclick="quit()">Quit</button>`;
 const iv=setInterval(()=>{const l=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));$('tl').textContent=l;if(l<=0)finish()},200);timers.push(iv);round()}
function round(){if(!G)return;const r=G.r=makeRound(G.st.level,G.rand),gr=$('gr');
 gr.style.gridTemplateColumns=`repeat(${r.d.grid},1fr)`;
 const l=S.set.dark===false||(S.set.dark===null&&!matchMedia('(prefers-color-scheme:dark)').matches)?52:72;
 let h='';for(let i=0;i<r.n;i++){const odd=i===r.target;h+=`<button class="t" data-i="${i}" aria-label="dot"><i style="background:hsl(${r.hue},70%,${odd?l+(l>60?-1:1)*r.d.delta*60:l}%);${odd?`width:${74-Math.min(14,r.d.delta*35)}%;height:${74-Math.min(14,r.d.delta*35)}%`:''}"></i></button>`}
 gr.innerHTML=h;gr.onpointerdown=e=>{const b=e.target.closest('.t');if(b)answer(+b.dataset.i)};
 G.lock=false;G.t0=performance.now();
 const rb=$('rb');rb.style.transition='none';rb.style.width='100%';void rb.offsetWidth;rb.style.transition=`width ${r.d.limit}ms linear`;rb.style.width='0%';
 clearTimeout(G.to);G.to=setTimeout(()=>answer(-1),r.d.limit);timers.push(G.to)}
function flash(t){const f=$('fl');if(f){f.textContent=t;f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')}}
function answer(i){if(!G||G.lock)return;G.lock=true;clearTimeout(G.to);
 const r=G.r,rt=performance.now()-G.t0,ok=i===r.target;G.tot++;
 const cells=$('gr').children;
 if(ok){G.ok++;G.rtS+=rt;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);const p=scoreCorrect(rt,G.st.level,G.combo);G.score+=p;
  cells[i].classList.add('ok');[3,5,10,20].includes(G.combo)?(sfx.combo(),flash(G.combo>=20?'Flow!':'Combo x'+comboMult(G.combo))):(sfx.ok(),flash(rt<500?'Perfect +'+p:rt<900?'Fast +'+p:'+'+p))}
 else{G.combo=0;G.score=Math.max(0,G.score-1);if(i>=0)cells[i].classList.add('no');cells[r.target].classList.add('show');sfx.no();flash(i<0?'Too slow -1':'-1')}
 adapt(G.st,ok,ok?rt:r.d.limit,r.d.limit);
 $('sc').textContent=G.score;$('cb').textContent=G.combo;
 setTimeout(()=>{if(G&&Date.now()<G.endAt)round()},ok?180:650)}
function quit(){if(confirm('Quit this run? Progress from it will not be saved.'))home()}
function finish(){if(!G)return;const g=G;clearT();G=null;sfx.end();
 const acc=g.tot?Math.round(g.ok/g.tot*100):0,rt=g.ok?g.rtS/g.ok/1000:0,nb=g.score>S.best;
 const k=dayKey(),y=dayKey(new Date(Date.now()-864e5));
 if(S.lastDay!==k){S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=k}
 S.played++;S.total+=g.tot;S.correct+=g.ok;S.rtSum+=g.rtS;S.rtN+=g.ok;S.secs+=60;S.level=Math.round(g.st.level);
 S.bestCombo=Math.max(S.bestCombo,g.bestCombo);if(acc>S.bestAcc&&g.tot>=10)S.bestAcc=acc;if(rt&&(!S.bestRt||rt<S.bestRt))S.bestRt=rt;
 if(nb)S.best=g.score;S.today={day:k,score:Math.max(S.today.day===k?S.today.score:0,g.score)};
 if(g.daily)S.daily={day:k,score:g.score};
 S.hist=[{d:k,s:g.score,a:acc}].concat(S.hist).slice(0,50);save();
 app.innerHTML=`<div class="res" style="margin-top:6vh"><p class="sub">${g.daily?'Daily complete':"Time's up"}</p><div class="big">${g.score}</div><p class="sub">Score</p>${nb?'<p class="pop" style="color:var(--acc);font-weight:700">New best score</p>':''}${S.streak>1?`<p>${S.streak} day streak</p>`:''}</div>
 <div class="g2"><div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>${rt?rt.toFixed(2)+'s':'–'}</b><span>Avg reaction</span></div><div class="stat"><b>${g.bestCombo}</b><span>Best combo</span></div><div class="stat"><b>${Math.round(g.st.level)}</b><span>Level reached</span></div></div>
 ${g.daily?'':'<button class="btn" onclick="start(false)">Play again</button>'}<button class="btn alt" onclick="home()">Home</button>`}
function stats(){const acc=S.total?S.correct/S.total*100:0,rt=S.rtN?S.rtSum/S.rtN/1000:0;
 const foc=Math.round(acc),rea=rt?Math.round(clamp(100-(rt-.3)*100,0,100)):0,att=Math.round(clamp(S.level*4,0,100));
 const bar=(n,v)=>`<div>${n} <b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div>`;
 app.innerHTML=`<h1 style="font-size:30px">Your progress</h1>${bar('Focus score',foc)}${bar('Reaction score',rea)}${bar('Attention level',att)}
 <div class="g2"><div class="stat"><b>${S.played}</b><span>Games played</span></div><div class="stat"><b>${S.best}</b><span>Best score</span></div><div class="stat"><b>${S.bestCombo}</b><span>Best combo</span></div><div class="stat"><b>${rt?rt.toFixed(2)+'s':'–'}</b><span>Avg reaction</span></div><div class="stat"><b>${S.bestRt?S.bestRt.toFixed(2)+'s':'–'}</b><span>Best reaction</span></div><div class="stat"><b>${Math.round(S.secs/60)} min</b><span>Training time</span></div></div>
 <p class="sub">Training scores are practice feedback, not a measure of intelligence.</p><button class="btn alt" onclick="home()">Home</button>`}
function settings(){const T=(k,l)=>`<div class="row"><span>${l}</span><button class="tog ${S.set[k]?'on':''}" onclick="tg('${k}')" aria-label="${l}"></button></div>`;
 app.innerHTML=`<h1 style="font-size:30px">Settings</h1>${T('sound','Sound')}${T('haptics','Vibration')}<div class="row"><span>Dark mode</span><button class="tog ${S.set.dark===true||(S.set.dark===null&&matchMedia('(prefers-color-scheme:dark)').matches)?'on':''}" onclick="S.set.dark=!(document.documentElement.getAttribute('data-theme')==='dark'||(S.set.dark===null&&matchMedia('(prefers-color-scheme:dark)').matches));save();applyTheme();settings()"></button></div>${T('reduce','Reduce motion')}
 <button class="btn alt" style="color:var(--bad);border-color:var(--bad)" onclick="if(confirm('Delete all progress? This cannot be undone.')){S=JSON.parse(JSON.stringify(def));save();applyTheme();home()}">Reset progress</button><button class="btn alt" onclick="home()">Home</button>`}
function tg(k){S.set[k]=!S.set[k];save();applyTheme();settings();if(k==='sound')sfx.ok()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.endAt)finish()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();applyTheme();home();
</script></body></html>
